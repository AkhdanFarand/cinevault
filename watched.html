<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            CineVault
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html" id="homeLink">
                    Home
                </a>
            </li>

            <li>
                <a href="watchlist.html" id="watchlistLink">
                    Watchlist
                </a>
            </li>

            <li>
                <a href="watched.html" id="watchedLink">
                    Watched
                </a>
            </li>

            <li>
                <a href="favourites.html" id="favoriteLink">
                    Favorites
                </a>
            </li>

        </ul>

    </nav>

    <!-- Movies Section -->
    <section class="movies">

        <h2>Watched</h2>

        <!-- Toolbar -->
        <div class="movie-toolbar">

            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Search Movies..."
            >

            <button
                id="openModal"
                class="add-btn"
            >
                + Add Movie
            </button>

        </div>

        <!-- Movie Grid -->
        <div class="movie-grid"></div>

    </section>

    <!-- Modal -->
    <div id="movieModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>Add Movie</h2>

                <button
                    id="closeModal"
                    class="close-btn"
                >
                    ×
                </button>

            </div>

            <input
                type="text"
                class="modal-search"
                placeholder="Search movie..."
            >

            <div class="search-results">

                <div class="result-item">
                    Interstellar
                </div>

                <div class="result-item">
                    Inception
                </div>

                <div class="result-item">
                    Oppenheimer
                </div>

                <div class="result-item">
                    The Dark Knight
                </div>

            </div>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
