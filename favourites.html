<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            <img
                src="assets/logo.png"
                alt="CineVault Logo"
                class="logo-img"
            >
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="watchlist.html">
                    Watchlist
                </a>
            </li>

            <li>
                <a href="watched.html">
                    Watched
                </a>
            </li>

            <li>
                <a href="favourites.html">
                    Favorites
                </a>
            </li>

        </ul>

    </nav>

    <!-- Movies Section -->
    <section class="movies">

        <h2>Favourites</h2>

    <!-- Toolbar -->
    <div class="movie-toolbar">

        <!-- Search -->
        <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search Movies..."
        >

        <!-- Filters -->
        <div class="filters">

            <select id="genreFilter">

                <option>Genre</option>

                <option>All</option>
                <option>Action</option>
                <option>Drama</option>
                <option>Comedy</option>
                <option>Sci-Fi</option>
                <option>Thriller</option>
                <option>Romance</option>
                <option>Horror</option>

            </select>

            <select id="statusFilter">

                <option>Status</option>

                <option>All</option>
                <option>Watchlist</option>
                <option>Watched</option>

            </select>

            <select id="sortFilter">

                <option>Sort By</option>

                <option>Title</option>
                <option>Year</option>

            </select>

        </div>

        <button
            id="openModal"
            class="add-btn"
        >
            + Add Movie
        </button>

    </div>

        <!-- Movie Grid -->
        <div class="movie-grid"></div>

    </section>

    <!-- Modal -->
    <div
        id="movieModal"
        class="modal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2>Add Movie</h2>

                <button
                    id="closeModal"
                    class="close-btn"
                >
                    ×
                </button>

            </div>

            <input
                type="text"
                id="modalSearchInput"
                class="modal-search"
                placeholder="Search movie..."
            >

            <div
                id="searchResults"
                class="search-results"
            ></div>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
