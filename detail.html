<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault - Movie Detail</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            <img
                src="assets/logo.png"
                alt="CineVault Logo"
                class="logo-img"
            >
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="watchlist.html">
                    Watchlist
                </a>
            </li>

            <li>
                <a href="watched.html">
                    Watched
                </a>
            </li>

            <li>
                <a href="favourites.html">
                    Favorites
                </a>
            </li>

        </ul>

    </nav>

    <section class="movie-detail">

    

    <div class="detail-container">

        <img
            id="detailPoster"
            class="detail-poster"
            src=""
            alt=""
        >

        <div class="detail-info">

            <div class="detail-top">

                <h1 id="detailTitle">
                    Loading...
                </h1>

                <span id="detailYear"></span>

            </div>

            <p
                id="detailDirector"
                class="detail-director"
            ></p>

            <p
                id="detailPlot"
                class="detail-plot"
            ></p>
            <div class="action-panel">

    <!-- TOP ACTIONS -->

    <div class="detail-actions">

        <button
            id="watchBtn"
            class="action-btn"
        >
            <div class="action-icon">
                👁
            </div>

            <span>Watch</span>
        </button>

        <button
            id="likeBtn"
            class="action-btn"
        >
            <div class="action-icon">
                ❤
            </div>

            <span>Like</span>
        </button>

        <button
            id="watchlistBtn"
            class="action-btn"
        >
            <div class="action-icon">
                🔖
            </div>

            <span>Watchlist</span>
        </button>

    </div>

        <!-- RATE -->

        <div class="rating-section">

            <p>Rate</p>

            <div class="stars">

                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>

            </div>

        </div>

    </div>

        </div>

    </div>
    
    <button
            class="back-btn"
            onclick="history.back()"
        >
            ← Back
        </button>
</section>

    <script src="js/detail.js"></script>

</body>
</html>
