<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault - Movie Detail</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            <img
                src="assets/logo.png"
                alt="CineVault Logo"
                class="logo-img"
            >
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="watchlist.html">
                    Watchlist
                </a>
            </li>

            <li>
                <a href="watched.html">
                    Watched
                </a>
            </li>

            <li>
                <a href="favourites.html">
                    Favorites
                </a>
            </li>

        </ul>

    </nav>

    <section class="movie-detail">

        <div class="detail-container">

            <img
                id="detailPoster"
                class="detail-poster"
                src=""
                alt=""
            >

            <div class="detail-info">

                <h1 id="detailTitle">
                    Loading...
                </h1>

                <p id="detailYear"></p>

                <p id="detailGenre"></p>

                <p id="detailPlot"></p>

                <p id="detailActors"></p>

                <p id="detailDirector"></p>

                <p id="detailRating"></p>

            </div>

        </div>

    </section>

    <script src="js/detail.js"></script>
