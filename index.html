<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            CineVault
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="watchlist.html">
                    Watchlist
                </a>
            </li>

            <li>
                <a href="watched.html">
                    Watched
                </a>
            </li>

            <li>
                <a href="favourites.html">
                    Favorites
                </a>
            </li>

        </ul>

    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">

            <h1>
                Track Movies You Want To Watch
            </h1>

            <p>
                Organize your movie watchlist,
                mark films as watched,
                and keep track of your favourites.
            </p>

            <a href="#movies-section" class="hero-btn">
                Explore Watchlist
            </a>

        </div>

    </section>

    <!-- Movies Section -->
    <section
        id="movies-section"
        class="movies"
    >

        <h2>All Movies</h2>

        <!-- Toolbar -->
        <div class="movie-toolbar">

            <!-- Search -->
            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Search Movies..."
            >

            <!-- Filters -->
            <div class="filters">

                <select id="genreFilter">

                    <option>Genre</option>

                    <option>All</option>
                    <option>Action</option>
                    <option>Drama</option>
                    <option>Comedy</option>
                    <option>Sci-Fi</option>
                    <option>Thriller</option>
                    <option>Romance</option>
                    <option>Horror</option>

                </select>

                <select id="statusFilter">

                    <option>Status</option>

                    <option>All</option>
                    <option>Watchlist</option>
                    <option>Watched</option>

                </select>

                <select id="sortFilter">

                    <option>Sort By</option>

                    <option>Title</option>
                    <option>Year</option>

                </select>

            </div>

            <!-- Add Movie -->
            <button
                id="openModal"
                class="add-btn"
            >
                + Add Movie
            </button>

        </div>

        <!-- Movie Grid -->
        <div class="movie-grid"></div>

    </section>

    <!-- Modal -->
    <div
        id="movieModal"
        class="modal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2>Add Movie</h2>

                <button
                    id="closeModal"
                    class="close-btn"
                >
                    ×
                </button>

            </div>

            <input
                type="text"
                class="modal-search"
                placeholder="Search movie..."
            >

            <div class="search-results">

                <div class="result-item">
                    Interstellar
                </div>

                <div class="result-item">
                    Inception
                </div>

                <div class="result-item">
                    Oppenheimer
                </div>

                <div class="result-item">
                    The Dark Knight
                </div>

            </div>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
