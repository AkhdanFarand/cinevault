<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            <img
                src="assets/logo.png"
                alt="CineVault Logo"
                class="logo-img"
            >
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="watchlist.html">
                    Watchlist
                </a>
            </li>

            <li>
                <a href="watched.html">
                    Watched
                </a>
            </li>

            <li>
                <a href="favourites.html">
                    Favorites
                </a>
            </li>

        </ul>

    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">

            <h1>
                Track Movies You Want To Watch
            </h1>

            <p>
                Organize your movie watchlist,
                mark films as watched,
                and keep track of your favourites.
            </p>

            <a href="#movies-section" class="hero-btn">
                Explore Watchlist
            </a>

        </div>

    </section>

    <!-- Movies Section -->
    <section
        id="movies-section"
        class="movies"
    >

        <h2>All Movies</h2>

        <!-- Toolbar -->
        <div class="movie-toolbar">

            <!-- Search -->
            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Search Movies..."
            >

            <!-- Filters -->
            <div class="filters">

                <select id="genreFilter">

                    <option value="">
                        Genre
                    </option>

                    <option value="Action">
                        Action
                    </option>

                    <option value="Drama">
                        Drama
                    </option>

                    <option value="Comedy">
                        Comedy
                    </option>

                    <option value="Sci-Fi">
                        Sci-Fi
                    </option>

                    <option value="Thriller">
                        Thriller
                    </option>

                    <option value="Romance">
                        Romance
                    </option>

                    <option value="Horror">
                        Horror
                    </option>

                </select>

                <select id="statusFilter">

                    <option value="">
                        Status
                    </option>

                    <option value="watchlist">
                        Watchlist
                    </option>

                    <option value="watched">
                        Watched
                    </option>

                </select>

                <select id="sortFilter">

                    <option value="">
                        Sort By
                    </option>

                    <option value="title">
                        Title
                    </option>

                    <option value="year">
                        Year
                    </option>

                </select>

            </div>

            <!-- Add Movie -->
            <button
                id="openModal"
                class="add-btn"
            >
                + Add Movie
            </button>

        </div>

        <!-- Movie Grid -->
        <div class="movie-grid"></div>

    </section>

    <!-- Modal -->
    <div
        id="movieModal"
        class="modal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2>Add Movie</h2>

                <button
                    id="closeModal"
                    class="close-btn"
                >
                    ×
                </button>

            </div>

            <input
                type="text"
                id="modalSearchInput"
                class="modal-search"
                placeholder="Search movie..."
            >

            <div
                id="searchResults"
                class="search-results"
            ></div>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
